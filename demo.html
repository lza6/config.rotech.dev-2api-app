<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>OpenChat 2API 本地 Demo</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --accent:#7c5cff; --text:#e6e8ef; --dim:#8b90a0; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; background:var(--panel); border-bottom:1px solid #232735; display:flex; align-items:center; gap:10px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:#3ddc84; }
  header h1 { font-size:16px; font-weight:600; }
  header .tag { font-size:12px; color:var(--dim); }
  #chat { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px; max-width:860px; width:100%; margin:0 auto; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--panel); border:1px solid #232735; border-bottom-left-radius:4px; }
  .bot.err { border-color:#a33; color:#ff9b9b; }
  .meta { font-size:11px; color:var(--dim); margin-top:4px; }
  form { display:flex; gap:10px; padding:16px 24px; background:var(--panel); border-top:1px solid #232735; max-width:908px; width:100%; margin:0 auto; }
  input { flex:1; background:#0f1117; border:1px solid #2a2f40; color:var(--text); border-radius:8px; padding:11px 14px; font-size:15px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:11px 22px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>OpenChat 2API Demo</h1>
  <span class="tag">gptapi.rotech.dev 协议 · 本地 8901 · OpenAI 兼容 /v1/chat/completions</span>
</header>
<div id="chat"></div>
<form id="f">
  <input id="q" placeholder="输入问题… (Ctrl+Enter 发送)" autocomplete="off">
  <button id="send">发送</button>
</form>
<script>
const chat = document.getElementById('chat');
function add(cls, text, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className='meta'; m.textContent=meta; d.appendChild(m); }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  document.getElementById('q').value = '';
  add('user', q);
  const btn = document.getElementById('send'); btn.disabled = true;
  const thinking = add('bot', '…');
  try {
    const r = await fetch('/api/chat', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: q}) });
    const j = await r.json();
    thinking.remove();
    if (j.ok) {
      let content = j.plain, code = '';
      try { const p = JSON.parse(j.plain); content = p.data?.content ?? j.plain; code = 'code=' + p.code; } catch {}
      add('bot', content, code + ' · 已解密');
    } else {
      add('bot err', j.error, '上游密文: ' + (j.raw_b64 || ''));
    }
  } catch (ex) { thinking.remove(); add('bot err', '请求失败: ' + ex); }
  btn.disabled = false;
};
</script>
</body>
</html>
